<script>
        // Force PWA installation prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('PWA install prompt available');
            window.deferredPrompt = e;
            
            // Show install button after 5 seconds
            setTimeout(() => {
                if (window.deferredPrompt) {
                    this.showInstallPromotion();
                }
            }, 5000);
        });
        
        function showInstallPromotion() {
            const installBtn = document.createElement('button');
            installBtn.innerHTML = '📱 Install App';
            installBtn.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: #4CAF50;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                z-index: 9999;
                font-size: 14px;
                cursor: pointer;
            `;
            installBtn.onclick = () => this.installPWA();
            document.body.appendChild(installBtn);
        }
        
        async function installPWA() {
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                const { outcome } = await window.deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                window.deferredPrompt = null;
            }
        }
    </script>

<script>
// Register Service Worker for background sync
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        const swPath = '/employee-tracker-system/mobile-app/sw.js';
        navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('ServiceWorker registered:', registration);
            
            // Request periodic background sync (if supported)
              if ('sync' in registration) {
                registration.sync.register('sync-locations')
                    .then(() => console.log('Background sync registered'))
                    .catch(err => console.log('Sync registration failed:', err));
            }
            
        }).catch((err) => {
            console.log('❌ ServiceWorker registration failed:', err);
            // Fallback: Try relative path
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Fallback SW registered:', reg.scope))
                .catch(e => console.log('Both SW attempts failed'));
        });
    });
}

// Listen for messages from Service Worker
navigator.serviceWorker.addEventListener('message', event => {
    console.log('Message from SW:', event.data);
    if (event.data.type === 'SYNC_OFFLINE_DATA') {
        if (window.app && window.app.syncOfflineLocations) {
            window.app.syncOfflineLocations();
        }
    }
});
</script>
